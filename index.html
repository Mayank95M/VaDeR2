<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VaDeR – A Support for Validation in Design Research</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='white' stroke='%23C4375B' stroke-width='3'/%3E%3Ccircle cx='16' cy='16' r='7' fill='%232A2D31'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:ital,wght@0,400;0,500;0,600;1,400&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
<style>
:root{
  --desk:#E5E8E3; --sheet:#FFFFFF; --ink:#C4375B; --ink-2:#9C2443; --ink-wash:#F8E6EB;
  --graphite:#2A2D31; --graphite-2:#565B63; --graphite-3:#868B92; --rule:#D0D4CE; --rule-2:#E8EAE6;
  --marker:#F3DC4E; --ok:#2B7553; --focus:#C4375B;
  --sans:"IBM Plex Sans Condensed","Roboto Condensed","Arial Narrow","Helvetica Neue",Arial,sans-serif;
  --serif:"Source Serif 4","Source Serif Pro",Georgia,"Times New Roman",serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --desk:#15171A; --sheet:#1E2125; --ink:#E4648A; --ink-2:#F190AA; --ink-wash:#3A2029;
    --graphite:#E9EAEB; --graphite-2:#B7BBC1; --graphite-3:#8A8F96; --rule:#3A3F45; --rule-2:#2A2E33;
    --marker:#7A6A12; --ok:#62C094; color-scheme:dark;
  }
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--desk);color:var(--graphite);font:400 15px/1.5 var(--sans)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--ink-2);text-underline-offset:2px}
h1,h2,h3,h4{margin:0;font-weight:600}
p{margin:0 0 .8em}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.tnum{font-variant-numeric:tabular-nums}
.muted{color:var(--graphite-2)}
.small{font-size:13px}
.hidden{display:none!important}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font:500 14px/1.1 var(--sans);padding:9px 14px;border-radius:4px;border:1px solid var(--graphite);background:var(--sheet);color:var(--graphite);cursor:pointer;text-decoration:none;white-space:nowrap;min-height:38px}
.btn:hover{background:var(--rule-2)}
.btn.primary{background:var(--graphite);color:var(--sheet)}
.btn.primary:hover{background:var(--graphite-2);border-color:var(--graphite-2)}
.btn.quiet{border-color:transparent;background:transparent;color:var(--graphite-2)}
.btn.quiet:hover{background:var(--rule-2);color:var(--graphite)}
.btn.danger{border-color:var(--ink);color:var(--ink-2)}
.btn.danger:hover{background:var(--ink-wash)}
.btn.sm{padding:6px 10px;min-height:32px;font-size:13px}
.btn:disabled,.btn[aria-disabled=true]{opacity:.45;cursor:not-allowed}
.btn-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.icon-btn{border:0;background:transparent;width:32px;height:32px;border-radius:4px;cursor:pointer;color:var(--graphite-2);font-size:18px;line-height:1;display:inline-grid;place-items:center}
.icon-btn:hover{background:var(--rule-2);color:var(--graphite)}

/* fields */
.field{display:grid;gap:5px;margin:0 0 14px}
.field>label,.field>.lab{font:500 13px/1.3 var(--sans);color:var(--graphite-2)}
.field .hint{font-size:12.5px;color:var(--graphite-2);line-height:1.4}
.inp,select.inp,textarea.inp{width:100%;font:400 15px/1.4 var(--sans);padding:8px 10px;border:1px solid var(--rule);border-radius:3px;background:var(--sheet);color:var(--graphite);min-height:38px}
textarea.inp{font:400 15px/1.55 var(--serif);min-height:110px;resize:vertical}
textarea.code{font:400 12px/1.5 var(--mono);min-height:260px;white-space:pre;overflow:auto}
.inp:focus{outline:2px solid var(--focus);outline-offset:0;border-color:transparent}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:0 16px}
.check{display:flex;gap:10px;align-items:flex-start;margin:0 0 10px;cursor:pointer;line-height:1.4}
.check input{margin:3px 0 0;width:17px;height:17px;accent-color:var(--graphite);flex:none}
.chip{display:inline-flex;align-items:center;gap:6px;font:500 13px/1 var(--sans);padding:5px 8px;border:1px solid var(--rule);border-radius:999px;background:var(--sheet)}
.chip button{border:0;background:none;cursor:pointer;color:var(--graphite-2);padding:0 2px;font-size:15px;line-height:1}

/* toast + modal */
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--graphite);color:var(--sheet);padding:10px 16px;border-radius:4px;font:500 14px/1.3 var(--sans);opacity:0;pointer-events:none;transition:opacity .15s,transform .15s;z-index:100;max-width:90vw}
#toast.show{opacity:1;transform:translate(-50%,0)}
.modal-wrap{position:fixed;inset:0;background:rgba(20,22,25,.45);display:grid;place-items:center;padding:16px;z-index:50}
.modal{background:var(--sheet);width:min(560px,100%);max-height:calc(100vh - 32px);display:flex;flex-direction:column;border-top:3px solid var(--ink);border-radius:3px}
.modal.wide{width:min(880px,100%)}
.modal>header{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 20px 8px}
.modal>header h2{font:600 20px/1.25 var(--serif)}
.modal-body{padding:8px 20px 16px;overflow:auto}
.modal>footer{display:flex;justify-content:flex-end;gap:8px;padding:12px 20px 16px;border-top:1px solid var(--rule-2);flex-wrap:wrap}

/* bubbles: the answer-sheet mark */
.bub{position:relative;width:32px;height:32px;flex:none;display:inline-block}
.bub input{position:absolute;inset:0;width:100%;height:100%;opacity:0;margin:0;cursor:pointer;z-index:1}
.bub span{display:grid;place-items:center;width:100%;height:100%;border:1.5px solid var(--ink);border-radius:50%;font:500 12.5px/1 var(--sans);color:var(--ink-2);background:var(--sheet);transition:background-color .12s,color .12s}
.bub.box span{border-radius:5px}
.bub:hover span{background:var(--ink-wash)}
.bub input:checked+span{background:radial-gradient(circle at 38% 34%,#474b52 0,var(--graphite) 62%);border-color:var(--graphite);color:var(--sheet);animation:mark .16s ease-out}
.bub input:focus-visible+span{outline:2px solid var(--focus);outline-offset:2px}
.bub.na span{font-size:11px}
@keyframes mark{from{transform:scale(.7)}to{transform:scale(1)}}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .bub input:checked+span{background:var(--graphite);color:var(--sheet)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* ======================= participant sheet ======================= */
.run{min-height:100vh;padding:28px 16px 80px}
.sheet{max-width:780px;margin:0 auto;background:var(--sheet);border:1px solid var(--rule);border-radius:2px;padding:36px 48px 40px}
.sheet-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px 24px;flex-wrap:wrap;border-bottom:2px solid var(--ink);padding-bottom:14px;margin-bottom:28px}
.sheet-head h1{font:600 26px/1.2 var(--serif);max-width:32ch}
.sheet-head .who{font:400 13.5px/1.4 var(--sans);color:var(--graphite-2);margin-top:4px}
.prog{display:flex;gap:5px;flex-wrap:wrap;align-items:center;max-width:320px}
.prog i{width:11px;height:11px;border-radius:50%;border:1.5px solid var(--rule);display:block}
.prog i.done{background:var(--graphite);border-color:var(--graphite)}
.prog i.now{border-color:var(--ink);border-width:2.5px}
.prog-cap{font:500 12.5px/1 var(--sans);color:var(--graphite-2);margin-top:6px;text-align:right;width:100%}
.page-title{font:600 24px/1.25 var(--serif);margin:0 0 6px}
.page-kicker{font:500 14px/1.3 var(--sans);color:var(--ink-2);margin:0 0 4px}
.prose{font:400 17px/1.62 var(--serif);max-width:66ch}
.prose h3{font:600 18px/1.35 var(--serif);margin:1.2em 0 .4em}
.prose ul,.prose ol{padding-left:1.3em;margin:0 0 .9em}
.prose li{margin:.25em 0}
.intro{font:400 16.5px/1.6 var(--serif);color:var(--graphite-2);margin:4px 0 22px;max-width:64ch}
.nav{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:32px;padding-top:20px;border-top:1px solid var(--rule-2);flex-wrap:wrap}
.nav .btn.primary{min-width:140px}
.run-foot{max-width:780px;margin:14px auto 0;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font:400 13px/1.4 var(--sans);color:var(--graphite-2);padding:0 4px}
.run-foot button{background:none;border:0;padding:0;color:var(--graphite-2);text-decoration:underline;cursor:pointer;font:inherit}
.preview-bar{max-width:780px;margin:0 auto 12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font:500 13.5px/1.3 var(--sans);border:1.5px dashed var(--ink);border-radius:3px;padding:8px 12px;color:var(--ink-2);background:var(--sheet)}
.preview-bar select{min-height:30px;padding:3px 6px;font-size:13px}

/* questionnaire items */
.q-block{margin:0 0 26px}
.legend{display:flex;justify-content:space-between;gap:16px;font:500 13px/1.3 var(--sans);color:var(--ink-2)}
.legend.full{flex-wrap:wrap;justify-content:flex-start;gap:4px 16px;margin-bottom:10px}
.lk-head{display:grid;grid-template-columns:1fr auto;gap:0 24px;position:sticky;top:0;background:var(--sheet);z-index:2;padding:8px 0 6px;border-bottom:1px solid var(--rule)}
.item{display:grid;grid-template-columns:1fr auto;gap:10px 24px;align-items:center;padding:13px 0;border-bottom:1px solid var(--rule-2);border-radius:2px}
.item .qt{font:400 16.5px/1.5 var(--serif)}
.item .qt b{font-weight:600}
.item.stack{grid-template-columns:1fr}
.opts{display:flex;gap:7px;align-items:center}
.opts.dense{gap:4px}
.opts.dense .bub{width:29px;height:29px}
.opts .sep{width:10px}
.mob-legend{display:none}
.item.missing .qt>span:first-child,.item.missing>.qt{background:linear-gradient(transparent 52%,var(--marker) 52%,var(--marker) 90%,transparent 90%)}
.req-note{font:500 13px/1.3 var(--sans);color:var(--ink-2);margin-top:4px}
.bip{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center}
.bip .l{text-align:right;font:400 16px/1.3 var(--serif)}
.bip .r{font:400 16px/1.3 var(--serif)}
.choices{display:grid;gap:2px;margin-top:4px}
.choice{display:flex;align-items:center;gap:12px;padding:6px 0;cursor:pointer;font:400 16px/1.4 var(--serif)}
.choice .bub{width:26px;height:26px}
.other-inp{margin-left:38px;max-width:360px}
.sl{position:relative;padding:4px 0 0}
.sl .scale{position:relative;height:34px}
.sl svg{position:absolute;left:11px;right:11px;top:8px;width:calc(100% - 22px);height:22px;overflow:visible}
.sl svg line{stroke:var(--ink);stroke-width:1.2}
.sl input[type=range]{position:absolute;inset:0;width:100%;height:34px;margin:0;background:transparent;-webkit-appearance:none;appearance:none;cursor:pointer}
.sl input[type=range]::-webkit-slider-runnable-track{height:34px;background:transparent}
.sl input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;margin-top:6px;border-radius:50%;background:var(--graphite);border:3px solid var(--sheet);box-shadow:0 0 0 1.5px var(--graphite)}
.sl input[type=range]::-moz-range-track{height:34px;background:transparent}
.sl input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--graphite);border:3px solid var(--sheet);box-shadow:0 0 0 1.5px var(--graphite)}
.sl.untouched input[type=range]::-webkit-slider-thumb{opacity:0}
.sl.untouched input[type=range]::-moz-range-thumb{opacity:0}
.sl .ends{display:flex;justify-content:space-between;font:500 13px/1.3 var(--sans);color:var(--ink-2);padding:0 2px}
.sl .ends span:nth-child(2){text-align:center}
.sl .val{font:600 14px/1 var(--sans);min-width:3ch;text-align:right;color:var(--graphite)}
.sl-head{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.pairs{display:grid;gap:10px}
.pair{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:stretch}
.pair label{display:flex;align-items:center;gap:10px;border:1.5px solid var(--ink);border-radius:6px;padding:11px 12px;cursor:pointer;font:400 15.5px/1.35 var(--serif);background:var(--sheet)}
.pair label:hover{background:var(--ink-wash)}
.pair label.on{background:var(--graphite);color:var(--sheet);border-color:var(--graphite)}
.pair label input{position:absolute;opacity:0;pointer-events:none}
.pair label:focus-within{outline:2px solid var(--focus);outline-offset:2px}
.pair .or{align-self:center;font:500 13px/1 var(--sans);color:var(--graphite-3)}
.pair.missing label{box-shadow:inset 0 -10px 0 var(--marker)}
.task-site{display:flex;align-items:center;justify-content:space-between;gap:12px 16px;flex-wrap:wrap;border:1.5px solid var(--graphite);border-radius:4px;padding:14px 16px;margin:22px 0 0}
.task-site .host{font:500 14px/1.3 var(--sans);color:var(--graphite-2);word-break:break-all}
.task-status{margin-top:14px;font:400 15px/1.5 var(--sans);color:var(--graphite-2)}
.notice{border-left:3px solid var(--ink);padding:8px 12px;background:var(--ink-wash);font:400 14.5px/1.45 var(--sans);margin:14px 0}
.center-msg{text-align:left;padding:10px 0}
.center-msg .big{font:600 26px/1.25 var(--serif);margin-bottom:10px}
.code-box{display:inline-block;font:600 22px/1 var(--sans);letter-spacing:.06em;border:1.5px dashed var(--ink);padding:10px 16px;border-radius:4px;margin:6px 0 14px}
.data-peek{max-height:340px;overflow:auto;border:1px solid var(--rule);border-radius:3px;margin:12px 0}
@media (max-width:640px){
  .run{padding:0 0 60px}
  .sheet{border:0;border-radius:0;padding:22px 16px 28px}
  .sheet-head h1{font-size:22px}
  .prog{max-width:none}
  .prog-cap{text-align:left}
  .item{grid-template-columns:1fr;gap:10px}
  .lk-head{display:none}
  .mob-legend{display:flex;justify-content:space-between;font:500 12px/1.2 var(--sans);color:var(--ink-2);gap:10px}
  .opts{justify-content:space-between}
  .opts.dense{gap:2px}
  .opts.dense .bub{width:26px;height:26px}
  .bip{grid-template-columns:1fr 1fr}
  .bip .l{text-align:left;order:1}
  .bip .r{text-align:right;order:2}
  .bip .opts{order:3;grid-column:1/-1}
  .pair{grid-template-columns:1fr}
  .pair .or{justify-self:center}
  .run-foot{padding:0 16px}
  .preview-bar{margin:0;border-radius:0;border-width:0 0 1.5px}
}

/* ======================= studio ======================= */
.studio{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:100vh}
.rail{padding:22px 16px 18px;border-right:1px solid var(--rule);display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;font:600 21px/1 var(--sans);letter-spacing:.01em;padding:0 6px}
.brand .mark{width:22px;height:22px;border:2.5px solid var(--ink);border-radius:50%;display:grid;place-items:center;flex:none}
.brand .mark::after{content:"";width:9px;height:9px;border-radius:50%;background:var(--graphite)}
.brand small{font:400 12.5px/1.3 var(--sans);color:var(--graphite-2);display:block;margin-top:4px;letter-spacing:0}
.rail h3{font:500 13px/1 var(--sans);color:var(--graphite-2);padding:0 8px;margin-bottom:6px}
.exp-list{list-style:none;margin:0;padding:0;display:grid;gap:1px}
.exp-list button{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;border:0;background:transparent;padding:8px;border-radius:4px;cursor:pointer;font:500 14.5px/1.3 var(--sans);color:var(--graphite)}
.exp-list button:hover{background:var(--rule-2)}
.exp-list button[aria-current=true]{background:var(--sheet);box-shadow:inset 3px 0 0 var(--ink)}
.exp-list .st{margin-top:3px}
.rail-foot{margin-top:auto;display:grid;gap:8px;border-top:1px solid var(--rule);padding-top:14px}
.conn{display:flex;align-items:center;gap:8px;font:500 13.5px/1.3 var(--sans);padding:0 4px}
.dot{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--graphite-3);flex:none}
.dot.on{background:var(--ok);border-color:var(--ok)}
.main{min-width:0;padding:22px 32px 70px}
.head{display:flex;gap:14px 20px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.head .t{flex:1 1 360px;min-width:0}
.title-input{font:600 27px/1.2 var(--serif);border:0;border-bottom:1px dashed transparent;background:transparent;padding:2px 0;width:100%;color:var(--graphite);border-radius:0}
.title-input:hover{border-bottom-color:var(--rule)}
.title-input:focus{outline:none;border-bottom-color:var(--ink)}
.head .meta{font:400 13.5px/1.4 var(--sans);color:var(--graphite-2);margin-top:4px;display:flex;gap:6px 14px;flex-wrap:wrap;align-items:center}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--rule);margin:16px 0 22px;overflow-x:auto;scrollbar-width:none}
.tabs button{font:500 15px/1 var(--sans);padding:12px 14px 11px;border:0;background:none;color:var(--graphite-2);border-bottom:2.5px solid transparent;margin-bottom:-1px;cursor:pointer;white-space:nowrap}
.tabs button:hover{color:var(--graphite)}
.tabs button[aria-selected=true]{color:var(--graphite);border-bottom-color:var(--ink)}
.panel{background:var(--sheet);border:1px solid var(--rule);border-radius:3px;padding:20px 22px}
.panel+.panel{margin-top:16px}
.panel h2{font:600 19px/1.3 var(--serif);margin-bottom:4px}
.panel h3{font:600 15px/1.3 var(--sans);margin:18px 0 8px}
.panel .lead{color:var(--graphite-2);margin-bottom:14px;max-width:72ch}
.status{display:inline-flex;align-items:center;gap:6px;font:500 13px/1 var(--sans)}
.sb{width:12px;height:12px;border-radius:50%;border:1.5px solid var(--graphite-2);display:inline-block;flex:none;position:relative;background:var(--sheet)}
.sb.full{background:var(--graphite);border-color:var(--graphite)}
.sb.half{background:linear-gradient(90deg,var(--graphite) 50%,var(--sheet) 50%);border-color:var(--graphite)}
.sb.x{border-color:var(--ink)}
.sb.x::after{content:"";position:absolute;left:-2px;right:-2px;top:50%;height:1.5px;background:var(--ink);transform:rotate(-45deg)}
.sb.open{border-color:var(--ok);background:var(--ok)}

/* design: protocol spine */
.design{display:grid;grid-template-columns:minmax(300px,410px) minmax(0,1fr);gap:24px;align-items:start}
.spine{list-style:none;margin:0;padding:0;position:relative}
.spine::before{content:"";position:absolute;left:17px;top:22px;bottom:40px;width:2px;background:var(--ink);opacity:.4}
.step{position:relative;display:grid;grid-template-columns:36px minmax(0,1fr);gap:10px;align-items:start}
.step .num{width:36px;height:36px;border-radius:50%;border:2px solid var(--ink);background:var(--sheet);display:grid;place-items:center;font:600 14px/1 var(--sans);color:var(--ink-2);position:relative;z-index:1;margin-top:6px}
.step.sel .num{background:var(--ink);color:#fff}
.strip{background:var(--sheet);border:1px solid var(--rule);border-radius:4px;padding:10px 10px 10px 14px;cursor:pointer;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 8px;align-items:start}
.strip:hover{border-color:var(--graphite-3)}
.step.sel .strip{border-color:var(--ink);box-shadow:inset 3px 0 0 var(--ink)}
.strip .ty{font:500 12.5px/1.2 var(--sans);color:var(--ink-2)}
.strip .nm{font:600 15.5px/1.3 var(--sans);overflow-wrap:anywhere}
.strip .mt{font:400 13px/1.35 var(--sans);color:var(--graphite-2);grid-column:1/-1;overflow-wrap:anywhere}
.strip .tools{display:flex;gap:0;opacity:.0;transition:opacity .1s}
.step:hover .strip .tools,.step.sel .strip .tools,.strip:focus-within .tools{opacity:1}
@media (hover:none){.strip .tools{opacity:1}}
.strip .tools .icon-btn{width:28px;height:28px;font-size:15px}
.step.dragging{opacity:.4}
.step.drop-before .strip{box-shadow:0 -3px 0 var(--ink)}

<script type="text/plain" id="gs-template">
/**
 * VaDeR (A Support for Validation in Design Research) backend:
 * a Google Apps Script bound to a Google Sheet.
 * Stores experiment designs, participant links and responses in this spreadsheet
 * and emails you each time a participant submits.
 *
 * Generated by VaDeR on __GENERATED__.
 * Setup: in your Sheet choose Extensions > Apps Script, replace the sample code with this
 * file and SAVE it; then Deploy > New deployment > type: Web app, Execute as: Me,
 * Who has access: Anyone. Copy the web app URL with its Copy button.
 * Check: opening that URL in a private window should show {"ok":true,"app":"VaDeR",...}.
 * After changing this script: Deploy > Manage deployments > pencil > Version: New version.
 */
var ADMIN_KEY = '__ADMIN_KEY__';       // private: lets your VaDeR Studio read the data
var NOTIFY_EMAIL = '__NOTIFY_EMAIL__'; // where submission emails go
var CHUNK = 40000;                     // characters per cell when storing JSON
var VERSION = 2;                       // 2: email invitations and reminders, groups

var HEADERS = {
  Experiments: ['id', 'title', 'status', 'updated', 'json_parts', 'json'],
  Participants: ['experiment', 'pid', 'token', 'label', 'condition', 'link', 'status', 'step', 'of', 'started', 'updated', 'submitted', 'state_parts', 'state'],
  Responses: ['received', 'experiment', 'pid', 'condition', 'status', 'minutes', 'summary', 'json_parts', 'json'],
  Emails: ['time', 'experiment', 'pid', 'to', 'kind', 'result']
};

function setup() {
  Object.keys(HEADERS).forEach(function (n) { sheet_(n); });
  var quota = MailApp.getRemainingDailyQuota();
  Logger.log('VaDeR is ready. Sheet: ' + SpreadsheetApp.getActiveSpreadsheet().getUrl() + ' | emails left today: ' + quota);
}

function doGet(e) {
  var p = (e && e.parameter) || {};
  if (p.action === 'design') return json_(safe_(function () { return design_(p); }));
  return json_({ ok: true, app: 'VaDeR', version: VERSION, sheet: !!SpreadsheetApp.getActiveSpreadsheet() });
}

function doPost(e) {
  var req;
  try { req = JSON.parse(e.postData.contents); } catch (err) { return json_({ ok: false, error: 'Bad request' }); }
  return json_(safe_(function () { return route_(req); }));
}

function safe_(fn) {
  try { var r = fn() || {}; r.ok = true; return r; }
  catch (err) { return { ok: false, error: String((err && err.message) || err) }; }
}
function json_(obj) {
  return ContentService.createTextOutput(JSON.stringify(obj)).setMimeType(ContentService.MimeType.JSON);
}

var ADMIN = { ping: 1, saveExperiment: 1, listExperiments: 1, setStatus: 1, saveParticipants: 1, getParticipants: 1,
  removeParticipant: 1, getResponses: 1, resetParticipant: 1, testEmail: 1, sendEmails: 1 };

function route_(r) {
  if (ADMIN[r.action] && (!ADMIN_KEY || r.key !== ADMIN_KEY)) throw new Error('The admin key does not match this backend.');
  var out;
  switch (r.action) {
    case 'ping':
      var ss = SpreadsheetApp.getActiveSpreadsheet();
      Object.keys(HEADERS).forEach(function (n) { sheet_(n); });
      return { sheet: ss.getName(), url: ss.getUrl(), email: NOTIFY_EMAIL, quota: MailApp.getRemainingDailyQuota(), version: VERSION };
    case 'saveExperiment': return locked_(function () { return saveExperiment_(r.design, r.status); });
    case 'listExperiments': return { experiments: listExperiments_() };
    case 'setStatus': return locked_(function () { return setStatus_(r.exp, r.status); });
    case 'saveParticipants': return locked_(function () { return saveParticipants_(r.exp, r.participants || []); });
    case 'getParticipants': return { participants: participants_(r.exp) };
    case 'removeParticipant': return locked_(function () { removeParticipant_(r.exp, r.pid); return {}; });
    case 'getResponses': return { responses: responses_(r.exp) };
    case 'resetParticipant': return locked_(function () { wipe_(r.exp, r.pid, 'invited', false); return {}; });
    case 'sendEmails': return sendEmails_(r);

function checkDesign(E) {
  const I = [], add = (text, step, block) => I.push({ text, step, block });
  if (!E.steps.length) add('The study has no steps yet.', null, true);
  const ci = E.steps.findIndex(s => s.type === 'consent');
  if (ci < 0) add('There is no consent form. Most ethics committees require one.', null, false);
  else if (ci > 0) add('The consent form is not the first step.', E.steps[ci].id, false);
  E.steps.forEach(st => {
    if (st.type === 'consent') {
      if (!(st.checks || []).some(c => String(c).trim())) add('The consent form has no tick boxes.', st.id, false);
      if (/\[(Say where|Name of the ethics|name the committee)/i.test(st.body || '')) add('The consent text still contains [bracketed] parts to fill in.', st.id, false);
    }
    if (st.type === 'task' && !st.url && !Object.values(st.urls || {}).some(Boolean)) add(`Task ${st.code} has no website address; participants will get a Start button instead.`, st.id, false);
    if (st.type === 'questionnaire' && st.q.ref === 'custom') {
      if (!(st.q.items || []).length) add(`${st.q.title || st.q.code} has no questions.`, st.id, true);
      if ((st.q.items || []).some(i => !String(i.t || '').trim())) add(`${st.q.title || st.q.code} has a question without text.`, st.id, true);
    }
  });
  const seen = {};
  instances(E).forEach(({ q }) => { if (seen[q.code]) add(`Two questionnaires share the column prefix ${q.code}.`, null, true); seen[q.code] = 1; });
  if (!(E.researcher || {}).email) add('Add your email under Settings so participants can contact you.', 'settings', false);
  if (E.steps.some(s => s.type === 'checkpoint') && !ST.settings.backend) add('Two-part studies work best with a Google Sheet; without one, participants must come back on the same browser.', null, false);
  return I;
}

function parseLabel(label) {
  const m = String(label || '').match(/[^\s<>,;]+@[^\s<>,;]+\.[^\s<>,;]+/);
  const email = m ? m[0] : '';
  const name = String(label || '').replace(/<?[^\s<>,;]+@[^\s<>,;]+>?/, '').replace(/[,;]+$/, '').trim();
  return { email, name };
}

  const tpl = template || ST.settings.invite || DEFAULT_INVITE, { name, email } = parseLabel(p.label);
  const r = E.researcher || {};

    .replace(/\{name\}/g, name || 'participant').replace(/\{link\}/g, link).replace(/\{title\}/g, E.title)
    .replace(/\{system\}/g, E.system || 'a web tool').replace(/\{duration\}/g, durationText(E)).replace(/\{researcher\}/g, r.name || '').replace(/\{pid\}/g, p.pid);
  let subject = E.title;
  const sm = text.match(/^Subject:\s*(.*)\n+/i);

function createLinks(E, n, labels, group) {
  const list = ST.parts[E.id] = ST.parts[E.id] || [];
  const conds = E.settings.conditions || [];
  let maxNum = list.reduce((m, p) => Math.max(m, pidIndex(p.pid)), 0);
  const counts = {}; conds.forEach(c => counts[c.id] = list.filter(p => p.condition === c.id).length);
  const fresh = [];
  for (let k = 0; k < n; k++) {
    maxNum++;
    const pid = 'P' + String(maxNum).padStart(2, '0');
    let cond = '', idx = maxNum;
    if (conds.length) { cond = conds.slice().sort((a, b) => counts[a.id] - counts[b.id])[0].id; counts[cond]++; idx = counts[cond]; }
    fresh.push({ pid, token: token(12), label: labels && labels[k] ? labels[k] : '', condition: cond, group: group || '', idx, created: new Date().toISOString(), synced: false });
  }
  list.push(...fresh); saveStudio();
  return fresh;
}

function protocolHTML(E) {
  const e = t => esc(subst(t || '', E));
  const tasks = tasksOf(E), conds = E.settings.conditions || [], out = [];
  const cites = new Set();
  const qBlock = (q, where) => {
    const Q = resolveQ(q, E); if (!Q) return '';
    if (Q.inst) cites.add(Q.inst.cite);
    let s = `<h4>${esc(Q.title)}${Q.ref !== 'custom' ? ` <small>(${esc(Q.abbr)}; columns ${esc(q.code)}_…)</small>` : ` <small>(own questions; columns ${esc(q.code)}_…)</small>`}</h4>`;
    if (Q.intro) s += `<p class="i">${esc(Q.intro)}</p>`;
    const sc = Q.items.find(i => i.scale);
    if (sc && sc.scale && sc.scale.labels) s += `<p class="i">Response scale ${sc.scale.min}–${sc.scale.max}: ${Object.entries(sc.scale.labels).map(([k, v]) => k + ' = ' + esc(v)).join('; ')}${sc.scale.na ? '; N/A allowed' : ''}.</p>`;
    s += '<ol>' + Q.items.map(it => `<li>${it.type === 'bipolar' ? esc(it.left) + ' – ' + esc(it.right) : (it.name ? '<b>' + esc(it.name) + '.</b> ' : '') + esc(it.t)}${it.rev ? ' <small>(reverse keyed)</small>' : ''}${it.options ? ' <small>[' + it.options.map(esc).join(' / ') + ']</small>' : ''}${it.type === 'slider' ? ' <small>[slider ' + it.slider.min + '–' + it.slider.max + ']</small>' : ''}</li>`).join('') + '</ol>';
    if (Q.pairs) s += `<p class="i">Followed by ${pairKeys(Q).length} pairwise comparisons: ${esc(Q.pairs.prompt)}</p>`;
    return s;
  };
  out.push(`<h1>${esc(E.title)}</h1><p class="meta">${esc([E.researcher.name, E.researcher.affiliation].filter(Boolean).join(', '))}${E.researcher.email ? ', ' + esc(E.researcher.email) : ''}<br>Protocol generated ${new Date().toLocaleDateString(undefined, { day: 'numeric', month: 'long', year: 'numeric' })} from VaDeR (A Support for Validation in Design Research). Study ID ${esc(E.id)}.</p>`);
  out.push('<h2>Overview</h2><ul>' + [
    `Tool evaluated: ${esc(E.system || '–')}`, `Expected duration: ${esc(durationText(E))}`, `Steps: ${E.steps.length}; tasks: ${tasks.length}`,
    tasks.length > 1 ? `Task order: ${esc(CB_LABEL[E.settings.counterbalance || 'latin'])}` : '',
    conds.length ? `Between-subjects conditions: ${conds.map(c => esc(c.id + ' = ' + (c.name || ''))).join('; ')}` : 'Design: all participants receive the same procedure',
    'Data are collected through personal links; each response is time-stamped, and time on each page and task is recorded.',
  ].filter(Boolean).map(x => `<li>${x}</li>`).join('') + '</ul>');
  out.push('<h2>Procedure</h2>');
  E.steps.forEach((st, i) => {
    out.push(`<section><h3>${i + 1}. ${esc(STEP_TYPES[st.type].label)}: ${e(stepTitle(st, E))}</h3>`);
    if (st.type === 'consent') out.push(`<div class="box">${md(subst(st.body, E))}<p><b>Participants tick:</b></p><ul>${st.checks.map(c => '<li>☐ ' + e(c) + '</li>').join('')}</ul>${st.requireName ? '<p>Name typed as signature.</p>' : ''}</div>`);
    if (st.type === 'info' || st.type === 'checkpoint') out.push(`<div class="box">${md(subst(st.body, E))}</div>` + (st.type === 'checkpoint' && Number(st.waitDays) > 0 ? `<p class="i">Part 2 opens ${st.waitDays} days later.</p>` : ''));
    if (st.type === 'questionnaire') out.push(qBlock(st.q));
    if (st.type === 'task') {
      out.push(`<div class="box">${md(subst(st.body, E))}</div><p class="i">Website: ${esc(st.url || 'none')}${conds.length ? ' ' + conds.map(c => st.urls && st.urls[c.id] ? `(condition ${esc(c.id)}: ${esc(st.urls[c.id])})` : '').join(' ') : ''}. Expected ${st.estMin} min${Number(st.limitMin) > 0 ? `; time limit ${st.limitMin} min` : ''}.${st.cb ? ' Counterbalanced.' : ''} Time is measured from opening the site to selecting “finished”.</p>`);
      if (st.outcome) out.push('<p class="i">Afterwards: “Did you complete the task?” (yes, completely / partly / no).</p>');
      if (st.answer) out.push(`<p class="i">Afterwards: ${e(st.answer)} (open answer).</p>`);
      (st.post || []).forEach(q => out.push(qBlock(q, st.code)));
    }
    out.push('</section>');
  });
  out.push('<h2>Measures and scoring</h2><ul>' + measureList(E).filter(m => !m.minor).map(m => `<li>${esc(m.full)}: range ${m.min}–${m.max}${m.better === 'low' ? ', lower is better' : ''}${m.bench != null ? `, reference value ${m.bench}` : ''}.</li>`).join('') + '</ul>');
  if (cites.size) out.push('<h2>Instruments</h2><ul class="refs">' + Array.from(cites).map(c => `<li>${esc(c)}</li>`).join('') + '</ul>');
  const css = 'body{font:15px/1.55 Georgia,serif;color:#222;max-width:760px;margin:40px auto;padding:0 24px}h1{font:600 26px/1.2 system-ui,sans-serif;margin:0 0 6px}h2{font:600 18px system-ui,sans-serif;margin:32px 0 8px;border-bottom:1px solid #ccc;padding-bottom:4px}h3{font:600 15.5px system-ui,sans-serif;margin:22px 0 6px}h4{font:600 14.5px system-ui,sans-serif;margin:14px 0 4px}small{font-weight:400;color:#666}.meta{color:#555;font-size:13.5px}.box{border-left:3px solid #ddd;padding:2px 0 2px 14px;margin:6px 0}.i{color:#555;font-size:13.5px}ol,ul{padding-left:22px}li{margin:3px 0}.refs li{font-size:13.5px}section{break-inside:avoid-page}@media print{body{margin:0}}';
  return `<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Protocol: ${esc(E.title)}</title><style>${css}</style></head><body>${out.join('\n')}</body></html>`;
}


/* ============================ saving, backups and recovery ============================ */
// Where a study lives, from the most to the least immediate:
//   1. this browser: localStorage plus VaDeR's own IndexedDB database (see `store` and `vdb`);
//   2. the Google Sheet, when one is connected: published studies, participants and responses, plus a
//      working copy of every study (rows "draft:<id>" in Experiments, never seen by participants);
//   3. backup files (.vader): written automatically when a study starts collecting data, and kept up to
//      date on the computer where the browser allows it. Opening one in VaDeR restores and syncs everything.
// Version history (snapshots in the database) and a 30-day bin for deleted studies cover mistakes.
const tclock = d => d ? new Date(d).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '';
const TOP = (() => { try { return window.top === window.self; } catch (e) { return false; } })();
const CROSS_EMBED = (() => { if (TOP) return false; try { return !window.top.location.href; } catch (e) { return true; } })();
const BK = { fs: typeof window.showSaveFilePicker === 'function' && TOP, handles: {}, paused: {}, err: {}, busy: {}, timer: null, loaded: false };
const DAY = 864e5;

/* ---------------- status line ---------------- */
function paintSave() {
  const el = $('#save-state'); if (!el || !ST) return;
  el.innerHTML = ''; el.classList.remove('bad', 'warn');
  if (SAVE.fail) { el.classList.add('bad'); el.append(h('span', null, 'Not saved: this page can’t store data'), ' ', h('button', { class: 'linkish', onclick: () => saveAllToFile() }, 'Save to a file')); return; }
  const sheet = !!ST.settings.backend;
  let main;
  if (sheet && SAVE.sheetErr) main = h('span', { class: 'warn', title: SAVE.sheetErr }, '✓ Saved in this browser; Google Sheet copy failed, retrying');
  else if (sheet && SAVE.hold && SYNC_OFFER) main = h('span', null, '✓ Saved in this browser; the Google Sheet copy waits for your choice above');
  else if (sheet && (SAVE.busy || SAVE.timer)) main = h('span', null, '✓ Saved in this browser; copying to your Google Sheet…');
  else if (sheet && SAVE.sheetAt) main = h('span', null, '✓ Saved in this browser and your Google Sheet' + (SAVE.at && SAVE.at > SAVE.sheetAt ? '' : ' at ' + tclock(SAVE.sheetAt)));
  else main = h('span', null, '✓ ' + (SAVE.at ? 'Saved in this browser at ' + tclock(SAVE.at) : 'All changes saved in this browser'));
  el.append(main);
  const E = curExp(); if (!E) return;
  const b = backupState(E);
  const act = (label, fn) => h('button', { class: 'linkish', onclick: fn }, label);
  let part = null;

    const chk = await checkSheetForNewer({ autoNewer: ids });

      const pack = backupToBundles(c.data);
      const r = await restoreBundles(Object.assign(pack, { exported: c.data.exported }), { handle: f.handle, name: f.name });

/* ---------------- recovering a study from the links participants were sent ---------------- */
// A link made without a Google Sheet carries the whole study, so any one of them brings the study back
// with its original ID (participants' answer files then still import into it). A link made with a Sheet
// carries the Sheet's address; reconnecting to it brings back everything the Sheet holds.
async function recoverFromText(text) {
  const urls = Array.from(new Set((String(text || '').match(/(?:https?|file):\/\/[^\s<>"'`]+/g) || []).map(u => u.replace(/[),.;]+$/, ''))));
  const out = { studies: [], added: 0, sheets: [], bad: 0, links: urls.length };
  const designs = {}, parts = {}, sheets = {}; let base = '';
  for (const u of urls) {
    let url; try { url = new URL(u); } catch (e) { out.bad++; continue; }
    const hs = new URLSearchParams(url.hash.slice(1)), qs = url.searchParams;
    const b = u.split(/[?#]/)[0];
    if (hs.get('d')) {
      let d = null; try { d = await unpackJSON(hs.get('d')); } catch (e) { }
      if (!d || !d.id || !Array.isArray(d.steps)) { out.bad++; continue; }
      if (!designs[d.id] || (d.updatedAt || '') > (designs[d.id].updatedAt || '')) designs[d.id] = d;
      const pid = hs.get('p');
      if (pid) (parts[d.id] = parts[d.id] || []).push({ pid, token: token(12), label: '', condition: hs.get('c') || '', group: hs.get('g') || '', idx: Number(hs.get('n')) || pidIndex(pid), created: '', synced: false });
      base = base || b;
    } else if (qs.get('s')) {
      const exp = qs.get('s'), be = backendFromParam(qs.get('b')) || VADER_CONFIG.backend;
      if (be) (sheets[be] = sheets[be] || new Set()).add(exp);
      const pid = qs.get('p'), k = qs.get('k');
      if (pid && k) (parts[exp] = parts[exp] || []).push({ pid, token: k, label: '', condition: '', group: qs.get('g') || '', idx: Number(qs.get('n')) || pidIndex(pid), created: '', synced: true });
      base = base || b;
    } else out.bad++;
  }
  const ids = Object.keys(designs);
  if (ids.length) await takeSnapshot('Before recovering from participant links', true);
  ids.forEach(id => {
    const d = designs[id], exists = ST.exps.some(e => e.id === id);
    const r = mergeBundle({ design: d, meta: { status: 'open', liveAt: d.updatedAt || new Date().toISOString() }, parts: parts[id] || [] }, 'merge');
    out.studies.push({ title: d.title, id, existed: exists, added: r.parts });
  });
  Object.keys(parts).filter(id => !designs[id]).forEach(id => { if (ST.exps.some(e => e.id === id)) out.added += mergeParts(id, parts[id]); });
  if (base && !ST.settings.toolUrl && /^https?:/.test(base)) ST.settings.toolUrl = base;
  out.sheets = Object.keys(sheets).map(be => ({ backend: be, exps: Array.from(sheets[be]) }));
  if (ids.length) ST.cur = ids[0];
  saveStudio(); renderStudio();
  out.pending = parts;
  return out;
}

/* ---------------- simulated responses (for dry runs) ---------------- */
const SIM_TEXT = ['I compared two methods and chose the one with clearer steps.', 'Found it through the filters on the left.', 'The categories helped me narrow it down quickly.', 'Not sure; I went by the description.', 'It took a while to understand the filters, then it was easy.', 'Brainstorming, because the problem needed many ideas quickly.', 'The examples were the most useful part.'];
function simulate(E, n) {
  const out = [], conds = E.settings.conditions || [];
  for (let k = 1; k <= n; k++) {
    const pid = 'S' + String(k).padStart(2, '0'), r = rng('sim:' + E.id + ':' + pid);
    const g = () => { let s = 0; for (let i = 0; i < 6; i++) s += r(); return (s - 3) * Math.SQRT2; };
    const cond = conds.length ? conds[(k - 1) % conds.length].id : '', boost = conds.length > 1 && cond === conds[0].id ? .45 : 0;
    const idx = conds.length ? Math.ceil(k / conds.length) : k, lat = g() * .7;
    const order = buildOrder(E, E.id + ':' + pid, idx), answers = {}, tasks = {}, timing = {};
    const pick = (lo, hi, t) => Math.max(lo, Math.min(hi, Math.round(lo + (hi - lo) * t)));
    const fill = (Q, shift) => {
      if (!Q) return;
      const invert = Q.ref === 'TLX' || Q.ref === 'PSSUQ';
      Q.items.forEach(it => {
        let t = 1 / (1 + Math.exp(-(0.5 + lat + boost + shift + g() * .6)));
        if (invert) t = 1 - t;
        if (it.type === 'likert') { const sc = it.scale; answers[it.var] = it.attn !== undefined && it.attn !== '' ? Number(it.attn) : pick(sc.min, sc.max, it.rev ? 1 - t : t); }
        else if (it.type === 'bipolar') answers[it.var] = pick(it.scale.min, it.scale.max, it.rev ? 1 - t : t);
        else if (it.type === 'slider') { const s = it.slider; answers[it.var] = Math.round((s.min + (s.max - s.min) * t) / s.step) * s.step; }
        else if (it.type === 'single') answers[it.var] = it.attn || it.options[Math.floor(r() * it.options.length)];
        else if (it.type === 'multi') { const sel = it.options.filter(() => r() < .4); answers[it.var] = sel.length ? sel : [it.options[0]]; }
        else if (it.type === 'number') { const lo = Number(it.min || 0), hi = Number(it.max || lo + 10); answers[it.var] = Math.round(lo + (hi - lo) * r()); }
        else if ((it.type === 'text' || it.type === 'textarea') && r() < .6) answers[it.var] = SIM_TEXT[Math.floor(r() * SIM_TEXT.length)];
      });

      let sec = 25 + r() * 40;

      if (st.type === 'questionnaire') { const Q = resolveQ(st.q, E); fill(Q, shift); sec = 12 + (Q ? Q.items.length : 1) * (4 + r() * 5); }
      if (st.type === 'checkpoint') shift += .5;
      if (st.type === 'task') {
        pos++;

        const u = r(), outc = u < .12 - boost * .1 ? 'failed' : u < .3 - boost * .15 ? 'partly' : 'completed';

        (st.post || []).forEach(q => fill(resolveQ(q, E), shift + (outc === 'failed' ? -1.2 : outc === 'partly' ? -.5 : 0)));
        sec = tsec + 30 + r() * 30;
      }

      taskOrder: order.map(id => E.steps.find(s => s.id === id)).filter(s => s.type === 'task').map(s => s.code), order, consent: { given: true, at: new Date(t0).toISOString() }, answers, tasks, timing, meta: { simulated: true }, sim: true };
